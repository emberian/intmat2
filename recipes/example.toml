# Example recipe (lane C). Thin optics so light reaches through a 128-cell slab:
# a fresh world has pig≈0.5 everywhere, so alpha_p·0.5·Nz is the bare optical depth.
name = "example"
C = 8
seed = 1
backend = "metal"
N = 128
steps = 4000
capture_every = 250
n0 = 1.0
h_scale = 0.3
s0 = 0.0

[rule_scales]
self = 1.0
nb = 0.8
inp = 0.5
bias = 0.1
read = 0.8

[physics]
dt = 0.05
tau_h = 1.0
g0 = 0.5
g1 = -0.5
k_dep = 0.1
k_ero = 0.01
k_photo = 0.05
D0 = 0.2
alpha_s = 0.08
alpha_p = 0.01
L0 = 1.0
